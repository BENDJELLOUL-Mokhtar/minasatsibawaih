{% extends 'base.html' %}
{% block content %}
  <h2>اختبار قصير</h2>
  <form method="post" action="{{ url_for('quiz_submit') }}">
    {% for q in questions %}
      <fieldset class="mb-3">
        <legend>السؤال {{ loop.index }}:</legend>
        <div class="fw-bold mb-2">{{ q.text }}</div>
        {% for o in q.options %}
          <div class="form-check">
            <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="{{ loop.index0 }}" id="q{{ q.id }}_{{ loop.index0 }}" {% if loop.index0 == 0 %}checked{% endif %}>
            <label class="form-check-label" for="q{{ q.id }}_{{ loop.index0 }}">{{ o }}</label>
          </div>
        {% endfor %}
      </fieldset>
    {% endfor %}

    <div class="mb-3">
      <label class="form-label">بريدك الإلكتروني (اختياري لإرسال النتيجة)</label>
      <input type="email" name="email" class="form-control">
    </div>

    <button class="btn btn-primary">إرسال الأجوبة</button>
  </form>
{% endblock %}
